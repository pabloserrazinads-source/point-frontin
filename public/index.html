    <h3>${esc(profile?.name||'Cliente')}</h3>
    <div class="loyaltyProgressBarV115">
      <span style="width:${Math.min(100,(eligible?required:progress)/required*100)}%"></span>
    </div>
    <div class="loyaltyNumbersV115">
      <b>${eligible?required:progress}/${required} pedidos</b>
    </div>
    <p>${eligible
      ? `Você completou a meta e tem ${offer?.rewardPercent||10}% de desconto disponível.`
      : `Faltam ${remaining} pedido(s) para ganhar ${offer?.rewardPercent||10}% de desconto.`}
    </p>
  `;
}

function openMyLoyaltyV115(){
  const offer=activeLoyaltyOfferV113();
  const cached=getCachedCustomerPhoneV115();
  showModal(`
    <div class="row">
      <h2>Meu Clube de Fidelidade</h2>
      <button class="ghost" onclick="closeModal()">✕</button>
    </div>
    <p class="hint">Digite o celular usado nos seus pedidos.</p>
    <label>Celular</label>
    <input id="loyaltyPhoneV115" class="field" inputmode="tel" value="${esc(cached)}" placeholder="Ex.: 24999999999">
    <button class="btn full" onclick="lookupMyLoyaltyV115()">Consultar meu progresso</button>
    <div id="loyaltyResultV115" class="loyaltyResultV115"></div>
  `);
  if(cached)setTimeout(()=>lookupMyLoyaltyV115(),50);
}

async function lookupMyLoyaltyV115(){
  const input=document.getElementById('loyaltyPhoneV115');
  const result=document.getElementById('loyaltyResultV115');
  const phone=normalizeCustomerPhoneV113(input?.value||'');
  if(phone.length<10){
    if(result)result.innerHTML='<div class="notice bad">Informe um celular válido.</div>';
    return;
  }
  cacheCustomerPhoneV115(phone);
  if(result)result.innerHTML='<div class="notice">Consultando...</div>';
  const profile=await getCustomerProfileV115(phone);
  const offer=activeLoyaltyOfferV113();

  if(!profile){
    if(result)result.innerHTML='<div class="notice">Ainda não encontramos pedidos para este celular.</div>';
    return;
  }

  if(result)result.innerHTML=loyaltyModalContentV115(profile,offer);
  updateLoyaltyDisplaysV115(profile);
}

function updateLoyaltyDisplaysV115(profile){
  const offer=activeLoyaltyOfferV113();
  if(!offer||!profile)return;
  const msg=loyaltyProgressTextV113(profile.order_count,offer);

  const home=document.getElementById('loyaltyHomeTextV113');
  if(home)home.textContent=msg;

  const checkout=document.getElementById('loyaltyCustomerStatusV113');
  if(checkout)checkout.textContent=msg;
}

async function loadKnownCustomerV115(){
  const phone=getCachedCustomerPhoneV115();
  if(phone.length<10)return null;
  const profile=await getCustomerProfileV115(phone);
  if(profile)updateLoyaltyDisplaysV115(profile);
  return profile;
}

// Endereço agora também busca perfil online.
showDeliveryForm=function(){
  const cachedPhone=getCachedCustomerPhoneV115();
  _showDeliveryFormV114Base();

  if(cachedPhone){
    getCustomerProfileV115(cachedPhone).then(profile=>{
      if(!profile)return;
      const neigh=cfg.store.orderConfig?.deliveryCalc==='neighborhood'?document.getElementById('coNeigh'):null;
      const addr=document.getElementById('coAddr');
      const ref=document.getElementById('coRef');

      if(neigh&&profile.neighborhood){
        const exists=[...neigh.options].some(o=>o.value===profile.neighborhood);
        if(exists){
          neigh.value=profile.neighborhood;
          window.checkoutState.neighborhood=profile.neighborhood;
        }
      }
      if(addr&&profile.address)addr.value=profile.address;
      if(ref&&profile.reference)ref.value=profile.reference;
    });
  }
};

saveDeliveryAndPay=function(){
  const addr=document.getElementById('coAddr')?.value.trim()||'';
  const ref=document.getElementById('coRef')?.value.trim()||'';
  const neigh=cfg.store.orderConfig?.deliveryCalc==='neighborhood'?(document.getElementById('coNeigh')?.value||''):'';
  if(!addr){alert('Informe o endereço de entrega.');return}

  window.checkoutState.address=addr;
  window.checkoutState.reference=ref;
  window.checkoutState.neighborhood=neigh;

  showPaymentChoices();
};

// Checkout: preenche nome/celular e mostra progresso real do banco.
showCustomerForm=function(){
  const cachedPhone=getCachedCustomerPhoneV115();
  const st=window.checkoutState||{};
  if(!st.phone&&cachedPhone)st.phone=cachedPhone;

  _showCustomerFormV114Base();

  const phone=document.getElementById('coPhone');
  const name=document.getElementById('coName');

  if(cachedPhone){
    getCustomerProfileV115(cachedPhone).then(profile=>{
      if(!profile)return;
      if(name&&!name.value)name.value=profile.name||'';
      if(phone&&!phone.value)phone.value=profile.phone||cachedPhone;
      updateLoyaltyDisplaysV115(profile);
    });
  }

  if(phone){
    let timer=null;
    phone.addEventListener('input',()=>{
      clearTimeout(timer);
      timer=setTimeout(async()=>{
        const p=normalizeCustomerPhoneV113(phone.value);
        if(p.length<10)return;
        const profile=await getCustomerProfileV115(p);
        if(profile){
          if(name&&!name.value)name.value=profile.name||'';
          updateLoyaltyDisplaysV115(profile);
        }else{
          const el=document.getElementById('loyaltyCustomerStatusV113');
          if(el)el.textContent='Este será seu primeiro pedido no Clube de Fidelidade.';
        }
      },450);
    });
  }
};

// Finalização real: perfil + pedido + fidelidade, tudo no banco.
async function registerOrderAndCustomerV115(){
  const st=window.checkoutState||{};
  const phone=normalizeCustomerPhoneV113(st.phone);
  if(phone.length<10)throw new Error('Telefone inválido');

  cacheCustomerPhoneV115(phone);

  // Primeiro salva/atualiza o perfil completo.
  await upsertCustomerProfileV115({
    phone,
    name:st.customer,
    neighborhood:st.neighborhood||'',
    address:st.address||'',
    reference:st.reference||''
  });

  // Depois registra o pedido e incrementa fidelidade.
  const t=checkoutTotalsV111();
  const orderId=ensureClientOrderIdV113();

  const {data,error}=await supabaseClient.rpc('register_customer_order_v2',{
    p_client_order_id:orderId,
    p_phone:phone,
    p_name:String(st.customer||'').trim(),
    p_neighborhood:String(st.neighborhood||''),
    p_address:String(st.address||''),
    p_reference:String(st.reference||''),
    p_total:Number(t.total||0),
    p_order_text:buildOrderTextV111()
  });
  if(error)throw error;

  const result=Array.isArray(data)?data[0]||null:data;
  if(result)updateLoyaltyDisplaysV115(result);
  return result;
}

finishWhatsApp=async function(){
  const st=window.checkoutState||{};
  st.customer=document.getElementById('coName')?.value.trim()||'';
  st.phone=document.getElementById('coPhone')?.value.trim()||'';
  st.note=document.getElementById('coObs')?.value.trim()||'';

  if(!st.customer||!st.phone){
    alert('Informe seu nome e celular.');
    return;
  }

  const btn=[...document.querySelectorAll('button')].find(b=>b.textContent.includes('Enviar pelo WhatsApp'));
  const old=btn?.textContent||'Enviar pelo WhatsApp';
  if(btn){btn.disabled=true;btn.textContent='Salvando pedido...';}

  let profile=null;
  try{
    profile=await registerOrderAndCustomerV115();
  }catch(e){
    console.error('Erro ao salvar cliente/pedido:',e);
    if(btn){btn.disabled=false;btn.textContent=old;}
    alert('Não conseguimos registrar seu pedido no sistema. Tente novamente.');
    return;
  }

  showOrderBackupV111();

  const offer=activeLoyaltyOfferV113();
  if(profile&&offer){
    const sheet=document.getElementById('sheet');
    const box=document.createElement('div');
    box.className='notice loyaltyAfterOrderV114';
    box.style.marginTop='12px';
    box.textContent=loyaltyProgressTextV113(profile.order_count,offer);
    sheet?.appendChild(box);
  }

  setTimeout(()=>{
    try{window.open(whatsappUrlV111(),'_blank','noopener')}
    catch(e){console.warn(e)}
  },120);
};

// Meu Clube vira clicável.
const _renderClientOffersV115Base=renderClientOffers;
renderClientOffers=function(){
  _renderClientOffersV115Base();
  const offer=activeLoyaltyOfferV113();
  if(!offer)return;

  const card=document.querySelector('.loyaltyLookupV113');
  if(card){
    card.style.cursor='pointer';
    card.onclick=()=>openMyLoyaltyV115();
    card.setAttribute('role','button');
    card.setAttribute('tabindex','0');
    card.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')openMyLoyaltyV115()};
  }

  loadKnownCustomerV115();
};

// Ao iniciar o site, consulta o progresso salvo no Supabase.
document.addEventListener('DOMContentLoaded',()=>{
  setTimeout(()=>loadKnownCustomerV115(),700);
});

// Inicialização movida para a camada multi-loja v1.21.

document.addEventListener("DOMContentLoaded",()=>{restoreAdminSession()});

</script>


<script>
// ===== v1.16.2: FOCO AUTOMÁTICO EM OPÇÃO OBRIGATÓRIA =====
function clearRequiredFocusV1162(box){
  if(!box)return;
  box.classList.remove('v1162RequiredError');
  box.querySelector('.v1162RequiredMessage')?.remove();
}

function focusRequiredGroupV1162(box,g){
  if(!box)return;

  document.querySelectorAll('.choiceGroup.v1162RequiredError').forEach(clearRequiredFocusV1162);

  let msg=box.querySelector('.v1162RequiredMessage');
  if(!msg){
    msg=document.createElement('div');
    msg.className='v1162RequiredMessage';
    msg.innerHTML='⚠ Selecione a opção obrigatória para continuar.';
    const hint=box.querySelector('.hint');
    if(hint) hint.insertAdjacentElement('afterend',msg);
    else box.prepend(msg);
  }

  // Primeiro leva o cliente exatamente ao grupo que ficou faltando.
  box.scrollIntoView({
    behavior:'smooth',
    block:'center'
  });

  // O atraso deixa a rolagem começar antes dos dois flashes visuais.
  setTimeout(()=>{
    box.classList.remove('v1162RequiredError');
    void box.offsetWidth;
    box.classList.add('v1162RequiredError');
  },320);

  setTimeout(()=>box.classList.remove('v1162RequiredError'),1700);
}

const _handleChoiceChangeV1162=handleChoiceChange;
handleChoiceChange=function(inp){
  const box=inp?.closest?.('.choiceGroup');
  if(box) clearRequiredFocusV1162(box);
  return _handleChoiceChangeV1162(inp);
};

const _changeOptQtyV1162=changeOptQty;
changeOptQty=function(btn,delta){
  const box=btn?.closest?.('.choiceGroup');
  if(box) clearRequiredFocusV1162(box);
  return _changeOptQtyV1162(btn,delta);
};
</script>

function previewAppearanceV116(){

    'productBg','productText','productPrice','cartBg','cartText','modalBg','modalText',
    'buttonBg','buttonText','secondaryButtonBg','secondaryButtonText'];
  map.forEach(k=>{
    const el=document.getElementById('v116_'+k);
    if(el)cfg.store.theme[k]=el.value;
  });
  cfg.store.heroTitle=document.getElementById('v116HeroTitle')?.value??cfg.store.heroTitle;
  cfg.store.heroEmoji=document.getElementById('v116HeroEmoji')?.value??cfg.store.heroEmoji;

  const a=document.getElementById('v116PrevTitle'),b=document.getElementById('v116PrevText');
  if(a)a.textContent=[cfg.store.heroTitle,cfg.store.heroEmoji].filter(Boolean).join(' ');
  if(b)b.textContent=cfg.store.heroText;

  const keys=['primary','secondary','heroStart','heroEnd','background','card','text','muted','line','success','danger','warning',
    'headerBg','headerText','topCardBg','infoText','infoDetailText','infoLinkText','loyaltyBg','loyaltyText','noticeBg','noticeText',
    'categoryBg','categoryText','categoryActiveBg','categoryActiveText','sectionBg','sectionTitle',
    'productBg','productText','productPrice','cartBg','cartText','modalBg','modalText',
    'buttonBg','buttonText','secondaryButtonBg','secondaryButtonText'];
  keys.forEach(k=>{
    const host=document.getElementById('v116mini_'+k);
    if(host)host.innerHTML=v116MiniPreviewV1164(k);
  });
}

const _applyThemeV116_v117=applyThemeV116;
applyThemeV116=function(){
  _applyThemeV116_v117();ensureDesignV117();
  const d=cfg.store.design,t=cfg.store.theme,r=document.documentElement.style;
  r.setProperty('--site-bg',d.siteGradient?`linear-gradient(${Number(d.siteAngle)||160}deg,${d.siteBg1},${d.siteBg2})`:t.background);
  r.setProperty('--header-surface',d.headerGradient?`linear-gradient(${Number(d.headerAngle)||110}deg,${d.headerBg1},${d.headerBg2})`:t.headerBg);
  r.setProperty('--button-surface',d.buttonGradient?`linear-gradient(${Number(d.buttonAngle)||135}deg,${d.buttonBg1},${d.buttonBg2})`:t.buttonBg);
  r.setProperty('--radius-card',(Number(d.radius)||20)+'px');r.setProperty('--radius-button',Math.max(10,(Number(d.radius)||20)-7)+'px');r.setProperty('--radius-hero',(Number(d.radius)||20)+5+'px');
  const shadows={none:'none',soft:'0 5px 18px #2a123112',deep:'0 14px 38px #2a123126'};
  r.setProperty('--shadow-card',shadows[d.shadow]||shadows.soft);r.setProperty('--shadow-float',d.shadow==='deep'?'0 16px 42px #0006':'0 9px 28px #0004');
  r.setProperty('--space-scale',d.density==='compact'?.82:d.density==='airy'?1.16:1);
  document.body.dataset.cardStyle=d.cardStyle||'elevated';document.body.dataset.fontStyle=d.fontStyle||'modern';document.body.dataset.photoShape=d.photoShape||'default';
  // Hero always follows the chosen gradient pair.
  const hero=document.querySelector('#shopView .hero');if(hero)hero.style.background=`linear-gradient(135deg,${t.heroStart},${t.heroEnd})`;
};

function tplPreviewV117(id,tpl){

}
function applyTemplateV117(id){
  const tpl=DESIGN_TEMPLATES_V117[id];if(!tpl)return;
  cfg.store.theme=Object.assign({},cfg.store.theme||{},JSON.parse(JSON.stringify(tpl.theme)));
  cfg.store.design=Object.assign({},JSON.parse(JSON.stringify(tpl.design)),{template:id});
  applyThemeV116();generalAppearanceV116();
  setTimeout(()=>{document.querySelector('.v117Template.on')?.scrollIntoView({behavior:'smooth',block:'nearest'});},80);

function updateDesignV117(){

  const g=id=>document.getElementById(id);const chk=id=>!!g(id)?.checked;const val=(id,f)=>g(id)?.value??f;
  d.siteGradient=chk('v117SiteGradient');d.siteBg1=val('v117SiteBg1',d.siteBg1);d.siteBg2=val('v117SiteBg2',d.siteBg2);d.siteAngle=Number(val('v117SiteAngle',d.siteAngle));
  d.headerGradient=chk('v117HeaderGradient');d.headerBg1=val('v117HeaderBg1',d.headerBg1);d.headerBg2=val('v117HeaderBg2',d.headerBg2);d.headerAngle=Number(val('v117HeaderAngle',d.headerAngle));
  d.buttonGradient=chk('v117ButtonGradient');d.buttonBg1=val('v117ButtonBg1',d.buttonBg1);d.buttonBg2=val('v117ButtonBg2',d.buttonBg2);d.buttonAngle=Number(val('v117ButtonAngle',d.buttonAngle));
  d.radius=Number(val('v117Radius',d.radius));markCustomV117();applyThemeV116();
  ['Site','Header','Button'].forEach(n=>{const p=g('v117Prev'+n);if(!p)return;const key=n.toLowerCase();if(n==='Site')p.style.background=d.siteGradient?`linear-gradient(${d.siteAngle}deg,${d.siteBg1},${d.siteBg2})`:d.siteBg1;if(n==='Header')p.style.background=d.headerGradient?`linear-gradient(${d.headerAngle}deg,${d.headerBg1},${d.headerBg2})`:d.headerBg1;if(n==='Button')p.style.background=d.buttonGradient?`linear-gradient(${d.buttonAngle}deg,${d.buttonBg1},${d.buttonBg2})`:d.buttonBg1;});

previewAppearanceV116=function(){
  _previewAppearanceV116_v117();
  if(cfg.store?.design){cfg.store.design.template='custom'}
};

async function saveAppearanceV117(){
  // Captura textos/cores sem perder o design escolhido.
  const activeTemplate=cfg.store.design?.template||'custom';
  _previewAppearanceV116_v117();updateDesignV117();
  if(activeTemplate!=='custom')cfg.store.design.template=activeTemplate;
  const ok=await persistAdminStateV15({products:false,notify:true,message:'Visual, template e cores salvos online.'});
  if(ok){renderShop();generalAppearanceV116()}
}
function restoreAppearanceV117(){
  const t=DESIGN_TEMPLATES_V117.acai_moderno;

  applyThemeV116();generalAppearanceV116();
}

// Keep design state when the old restore helper is called elsewhere.
const _ensureV116Defaults_v117=ensureV116Defaults;

setTimeout(()=>{try{ensureDesignV117();applyThemeV116()}catch(e){}},0);

// ===== v1.19.0: FIDELIDADE COM DESCONTO AUTOMÁTICO =====
// O benefício é liberado DEPOIS que o cliente completa a meta (ex.: 10 pedidos)
// e é aplicado automaticamente no pedido seguinte. Ao registrar esse pedido,
// o contador avança e o benefício fica consumido até a próxima meta.
window.loyaltyBenefitV119={phone:'',orderCount:0,eligible:false,percent:0,required:10,offer:null};
let loyaltyLookupSeqV119=0;

function loyaltyStateFromProfileV119(profile){
  const offer=activeLoyaltyOfferV113();
  const phone=normalizeCustomerPhoneV113(profile?.phone||getCachedCustomerPhoneV115()||window.checkoutState?.phone||'');
  const count=Math.max(0,Number(profile?.order_count||0));
  const required=Math.max(1,Number(offer?.requiredOrders||10));
  const percent=Math.max(0,Math.min(100,Number(offer?.rewardPercent||10)));
  const eligible=!!offer&&count>0&&(count%required===0)&&percent>0;
  return {phone,orderCount:count,eligible,percent,required,offer};
}

function loyaltyPhoneMatchesV119(){
  const st=window.checkoutState||{};
  const typed=document.getElementById('coPhone')?.value||'';
  const current=normalizeCustomerPhoneV113(typed||st.phone||getCachedCustomerPhoneV115()||'');
  return !!current&&current===window.loyaltyBenefitV119.phone;
}

async function syncLoyaltyBenefitV119(phone){
  const normalized=normalizeCustomerPhoneV113(phone);
  const seq=++loyaltyLookupSeqV119;
  if(normalized.length<10){
    window.loyaltyBenefitV119={phone:normalized,orderCount:0,eligible:false,percent:0,required:10,offer:activeLoyaltyOfferV113()};
    return window.loyaltyBenefitV119;
  }
  const profile=await getCustomerProfileV115(normalized);
  if(seq!==loyaltyLookupSeqV119)return window.loyaltyBenefitV119;
  const state=loyaltyStateFromProfileV119(profile||{phone:normalized,order_count:0});
  state.phone=normalized;
  window.loyaltyBenefitV119=state;
  if(profile)updateLoyaltyDisplaysV115(profile);
  return state;
}

function loyaltyDiscountV119(base){
  const b=window.loyaltyBenefitV119||{};
  if(!b.eligible||!loyaltyPhoneMatchesV119())return 0;
  return Math.max(0,Number(base||0))*Math.max(0,Number(b.percent||0))/100;
}

// Totais consolidados: promoção comum + fidelidade + entrega + ajuste de pagamento + serviço.
checkoutTotalsV111=function(){
  const sub=cartSubtotal();
  const promo=activeOfferDiscount();
  const promoDiscount=Math.min(sub,Math.max(0,Number(promo?.amount||0)));
  const afterPromo=Math.max(0,sub-promoDiscount);
  const loyaltyDiscount=Math.min(afterPromo,loyaltyDiscountV119(afterPromo));
  const afterDiscounts=Math.max(0,afterPromo-loyaltyDiscount);
  const delivery=cartDeliveryFee();
  const payAdj=paymentAdjustment(afterDiscounts+delivery);
  const serviceBase=Math.max(0,afterDiscounts+delivery+payAdj);
  const service=serviceFeeAmountV111(serviceBase);
  const total=Math.max(0,afterDiscounts+delivery+payAdj+service);
  const lb=window.loyaltyBenefitV119||{};
  return {
    sub,delivery,payAdj,service,total,
    promoDiscount,promoOffer:promo?.offer||null,
    loyaltyDiscount,
    loyaltyPercent:Number(lb.percent||0),
    loyaltyOffer:lb.offer||activeLoyaltyOfferV113()||null
  };
};

function renderCheckoutTotalsV119(){
  const box=document.querySelector('#sheet .cartTotals')||document.querySelector('.sheet .cartTotals')||document.querySelector('.cartTotals');
  if(!box)return;
  const t=checkoutTotalsV111();
  const o=cfg.store.orderConfig||{};
  box.innerHTML=`
    <div class="row"><span>Valor dos produtos</span><b>${brl(t.sub)}</b></div>
    ${t.promoDiscount?`<div class="row discountLine"><span>${esc(t.promoOffer?.title||'Oferta')}</span><b>− ${brl(t.promoDiscount)}</b></div>`:''}
    ${t.loyaltyDiscount?`<div class="row discountLine loyaltyDiscountV119"><span>★ Fidelidade (${t.loyaltyPercent}%)</span><b>− ${brl(t.loyaltyDiscount)}</b></div>`:''}
    ${t.delivery?`<div class="row"><span>Taxa de entrega</span><b>${brl(t.delivery)}</b></div>`:''}
    ${t.payAdj?`<div class="row"><span>${t.payAdj>0?'Taxa':'Desconto'} de pagamento</span><b>${t.payAdj>0?'+ ':''}${brl(t.payAdj)}</b></div>`:''}
    ${t.service?`<div class="row"><span>${esc(o.serviceFeeLabel||'Taxa de serviço')}</span><b>${brl(t.service)}</b></div>`:''}
    <div class="row"><strong>Total</strong><strong>${brl(t.total)}</strong></div>`;

  const loyaltyBox=document.getElementById('loyaltyCustomerStatusV113');
  const b=window.loyaltyBenefitV119||{};
  if(loyaltyBox&&b.eligible&&loyaltyPhoneMatchesV119()){
    loyaltyBox.textContent=`🎉 Benefício liberado: ${b.percent}% de desconto aplicado automaticamente neste pedido.`;
  }
}

const _showCustomerFormV119Base=showCustomerForm;
showCustomerForm=function(){
  _showCustomerFormV119Base();
  const phone=document.getElementById('coPhone');
  if(!phone)return;

  let timer=null;
  const check=async()=>{
    window.checkoutState=window.checkoutState||{};
    window.checkoutState.phone=phone.value;
    await syncLoyaltyBenefitV119(phone.value);
    if(phone.isConnected)renderCheckoutTotalsV119();
  };

  phone.addEventListener('input',()=>{
    clearTimeout(timer);
    timer=setTimeout(check,350);
  });
  if(phone.value)setTimeout(check,0);
};

// Inclui as linhas de promoção/fidelidade no texto enviado ao WhatsApp.
const _buildOrderTextV119Base=buildOrderTextV111;
buildOrderTextV111=function(){
  let text=_buildOrderTextV119Base();
  const t=checkoutTotalsV111();
  const lines=text.split('\n');
  const totalIdx=lines.findIndex(x=>x.startsWith('*TOTAL:'));
  if(totalIdx>=0){
    const extra=[];
    if(t.promoDiscount)extra.push(`Oferta: ${t.promoOffer?.title||'Desconto'}: - ${brl(t.promoDiscount)}`);
    if(t.loyaltyDiscount)extra.push(`★ Fidelidade (${t.loyaltyPercent}%): - ${brl(t.loyaltyDiscount)}`);
    if(extra.length)lines.splice(totalIdx,0,...extra);
  }
  return lines.join('\n');
};

const _finishWhatsAppV119Base=finishWhatsApp;

  const phone=document.getElementById('coPhone')?.value||window.checkoutState?.phone||'';

    try{
      await syncLoyaltyBenefitV119(phone);
      renderCheckoutTotalsV119();
    }catch(e){console.warn('Não foi possível validar o benefício de fidelidade:',e)}
  }
  return _finishWhatsAppV119Base();
};

function readQrUploadV1201(input){
  const file=input?.files?.[0];
  if(!file)return;
  if(!file.type.startsWith('image/')){alert('Selecione uma imagem do QR Code.');input.value='';return;}
  if(file.size>8*1024*1024){alert('A imagem deve ter no máximo 8 MB.');input.value='';return;}
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=1200;
      const scale=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.max(1,Math.round(img.width*scale));
      const h=Math.max(1,Math.round(img.height*scale));
      const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(img,0,0,w,h);
      // PNG preserva melhor as bordas do QR Code.
      window.clientQrDraftV1201=canvas.toDataURL('image/png');
      renderQrPreviewV1201();
    };
    img.onerror=()=>alert('Não foi possível ler essa imagem.');
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

<script id="v121MultiTenant">
// ===== v1.21.0: PEDEVIA · LOJAS PÚBLICAS POR SLUG =====
const PEDEVIA_PUBLIC_BASE='https://pedevia.cardapioonline.workers.dev';
window.pedeviaTenantV121=null;

function tenantSlugFromLocationV121(){
  const qs=new URLSearchParams(location.search);
  const fromQuery=slugifyStoreV120(qs.get('loja')||'');
  if(fromQuery)return fromQuery;
  const parts=location.pathname.split('/').filter(Boolean);
  if(!parts.length)return '';
  const first=slugifyStoreV120(parts[0]);
  // caminhos técnicos que não representam uma loja
  if(['index-html','favicon-ico','robots-txt'].includes(first))return '';
  return first;
}

function tenantPublicUrlV121(slug){
  return `${PEDEVIA_PUBLIC_BASE}/${encodeURIComponent(slugifyStoreV120(slug))}`;
}

async function loadTenantRowV121(slug){
  // Cliente comum: somente lojas ativas por RPC pública e segura.
  try{
    const {data,error}=await supabaseClient.rpc('get_public_client_site',{p_slug:slug});
    if(!error && data){
      const row=Array.isArray(data)?data[0]:data;
      if(row && row.slug)return row;
    }
  }catch(e){console.warn('RPC pública da loja indisponível:',e)}

  // Dono da plataforma autenticado pode visualizar também rascunhos.
  try{
    const {data:sessionData}=await supabaseClient.auth.getSession();
    if(sessionData?.session){
      const {data,error}=await supabaseClient.from('client_sites').select('id,name,slug,whatsapp,active,config,admin_email,service_status,billing_due_date,monthly_fee,suspension_reason').eq('slug',slug).maybeSingle();
      if(!error && data)return data;
    }
  }catch(e){console.warn('Prévia autenticada indisponível:',e)}
  return null;
}

function applyTenantConfigV121(row){
  const incoming=JSON.parse(JSON.stringify(row?.config||{}));
  const safeBase=JSON.parse(JSON.stringify(DEFAULT));
  const store=Object.assign({},safeBase.store||{},incoming.store||{});
  store.name=row?.name||store.name||'Estabelecimento';
  store.whatsapp=row?.whatsapp||store.whatsapp||'';
  store.hubSlug=row?.slug||store.hubSlug||'';

    store,
    categories:Array.isArray(incoming.categories)?incoming.categories:[],
    sections:Array.isArray(incoming.sections)?incoming.sections:[],
    groups:Array.isArray(incoming.groups)?incoming.groups:[],
    products:Array.isArray(incoming.products)?incoming.products:[],
    offers:Array.isArray(incoming.offers)?incoming.offers:[]

  if(!cfg.sections.length){cfg.sections=[{id:'produtos',title:'Produtos',description:'',accent:'#712489',display:'cards',active:true,order:0}]}
  if(!cfg.categories.length){cfg.categories=cfg.sections.map(s=>({id:s.id,name:s.title||'Produtos',active:s.active!==false}))}

  try{if(typeof ensureDesignV117==='function')ensureDesignV117()}catch(e){console.warn(e)}
  try{if(typeof refreshVisualV116==='function')refreshVisualV116()}catch(e){console.warn(e)}
  try{if(typeof applyBrandHeaderV116==='function')applyBrandHeaderV116()}catch(e){console.warn(e)}
}

function readClientLogoV1211(input){
  const file=input?.files?.[0];if(!file)return;
  if(!file.type.startsWith('image/')){alert('Selecione uma imagem para a logo.');return}
  if(file.size>8*1024*1024){alert('A imagem deve ter no máximo 8 MB.');return}
  const reader=new FileReader();
  reader.onload=()=>{const img=new Image();img.onload=()=>{
    const max=900,scale=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    window.clientLogoDraftV1211=c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',0.86);
    renderClientLogoPreviewV1211();
  };img.src=reader.result};reader.readAsDataURL(file);
}

}

const PEDEVIA_ADMIN_FUNCTION_V122='pedevia-admin';

function currentTenantSlugV122(){

async function invokePedeviaAdminV122(body){
  const {data,error}=await supabaseClient.functions.invoke(PEDEVIA_ADMIN_FUNCTION_V122,{body});
  if(error){
    let msg=error.message||'Falha no servidor da Pedevia.';
    try{
      const ctx=error.context;
      if(ctx && typeof ctx.json==='function'){
        const j=await ctx.json();
        if(j?.error)msg=j.error;
      }
    }catch(_e){}
    throw new Error(msg);
  }
  if(!data?.ok)throw new Error(data?.error||'Não foi possível concluir a operação.');
  return data;
}

createClientSiteV120=async function(){
  const name=$('#csNameV120').value.trim();
  const slug=slugifyStoreV120($('#csSlugV120').value||name);
  const wa=$('#csWaV120').value.replace(/\D/g,'');

  const btn=$('#csCreateBtnV120');
  if(btn){btn.disabled=true;btn.textContent='Criando loja e enviando convite...'}
  try{
    const config=cleanClientConfigV120(name,wa);
    config.store.hubSlug=slug;
    const result=await invokePedeviaAdminV122({
      action:'create_site',name,slug,whatsapp:wa,admin_email:email,config,
      redirect_to:`${PEDEVIA_PUBLIC_BASE}/${encodeURIComponent(slug)}?definir-senha=1`
    });
    closeModal();
    await openClientSitesMasterV120();
    const site=result.site;
    const invite=result.invite||{};
    let text=`Loja “${name}” criada com sucesso.`;
    if(invite.sent) text+=`\n\nConvite enviado para ${email}. O cliente poderá definir a própria senha pelo e-mail.`;
    else if(invite.existing) text+=`\n\nEsse e-mail já possui uma conta. Ele já pode entrar com a senha existente.`;
    else text+=`\n\nA loja foi criada, mas o convite não foi enviado. Você pode reenviar em Gerenciar.`;
    alert(text);
    if(site?.id)setTimeout(()=>editClientSiteV120(site.id),120);
  }catch(e){
    console.error(e);alert('Não foi possível criar a loja: '+(e.message||e));
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Criar loja e enviar convite'}

};

async function maybeHandleInviteV122(){
  if(new URLSearchParams(location.search).get('definir-senha')!=='1')return;
  // O Supabase pode levar alguns instantes para converter o token do convite em sessão.
  for(let i=0;i<8;i++){
    const {data}=await supabaseClient.auth.getSession();
    if(data?.session){showSetPasswordV122();return}
    await new Promise(r=>setTimeout(r,250));
  }
  const msg=$('#loginMsg');if(msg)msg.textContent='Abra novamente o link do convite enviado para seu e-mail.';
}

    // Dá tempo para o token de convite virar uma sessão antes de consultar um rascunho.
    for(let i=0;i<6;i++){
      await new Promise(r=>setTimeout(r,250));
      try{row=await loadTenantAdminRowV122(slug);if(row)return row}catch(_e){}
    }
  }
  return null;
};

window.pedeviaInviteTenantNameV1243='';

async function resolveInviteTenantNameV1243(){
  const current=String(window.pedeviaTenantV121?.name||'').trim();
  if(current){window.pedeviaInviteTenantNameV1243=current;return current}

  const slug=tenantSlugFromLocationV121();
  if(slug){
    try{
      let row=null;
      // Primeiro tenta a rota pública, que funciona mesmo durante a conversão do convite em sessão.
      try{row=await loadTenantRowV121(slug)}catch(_e){}
      // Se já houver sessão autenticada, tenta também a leitura administrativa.
      if(!row){try{row=await loadTenantAdminRowV122(slug)}catch(_e){}}
      if(row?.name){
        window.pedeviaTenantV121=row;
        window.pedeviaInviteTenantNameV1243=String(row.name).trim();
        return window.pedeviaInviteTenantNameV1243;
      }
    }catch(e){console.warn('Não foi possível resolver o nome do tenant no convite.',e)}
  }

  const cfgName=String(cfg?.store?.name||'').trim();
  if(slug && /point do açaí frontin/i.test(cfgName))return 'seu estabelecimento';
  return cfgName||'seu estabelecimento';
}

function orderStatusLabelV125(status){
  return ({new:'Novo',accepted:'Aceito',preparing:'Preparando',ready:'Pronto',completed:'Concluído',cancelled:'Cancelado'})[status]||status||'Novo';
}
function orderStatusClassV125(status){
  return ['completed','ready'].includes(status)?'available':status==='cancelled'?'unavailable':'hidden';
}
function orderModeLabelV125(mode){return mode==='delivery'?'Entrega':mode==='pickup'?'Retirada':mode==='dinein'?'Consumo no local':mode||'-'}
function orderDateV125(v){
  try{return new Date(v).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(_e){return ''}
}
function orderNumberV125(o){return '#'+String(o.order_number||o.id||'').replace(/[^0-9A-Za-z-]/g,'').slice(-10)}

async function createOnlineOrderV125(){
  if(!storeAcceptingOrdersV125())throw new Error('O estabelecimento fechou antes da finalização. Tente novamente no próximo horário de funcionamento.');
  const st=window.checkoutState||{};
  const t=typeof checkoutTotalsV111==='function'?checkoutTotalsV111():{sub:sum(),total:sum()};
  const text=typeof buildOrderTextV111==='function'?buildOrderTextV111():'';
  const items=(cart||[]).map(i=>{
    const p=(cfg.products||[]).find(x=>x.id===i.pid);
    return {product_id:i.pid,name:p?.name||'Produto',variant:i.variantName||'',quantity:+i.qty||1,unit_price:+i.unit||0,groups:i.groups||[],note:i.obs||''};
  });
  const payload={
    store_key:currentStoreKeyV125(),
    store_name:currentStoreNameV125(),
    customer_name:String(st.customer||document.getElementById('coName')?.value||'').trim(),
    customer_phone:String(st.phone||document.getElementById('coPhone')?.value||'').trim(),
    order_mode:String(st.mode||''),
    address:String(st.address||''),
    neighborhood:String(st.neighborhood||''),
    table_number:String(st.table||''),
    payment_method:String(st.payment||''),
    note:String(st.note||document.getElementById('coObs')?.value||'').trim(),
    items,
    subtotal:Number(t.sub||0),
    discount:Number((t.promoDiscount||0)+(t.loyaltyDiscount||0)),
    delivery_fee:Number(t.delivery||0),
    payment_adjustment:Number(t.payAdj||0),
    service_fee:Number(t.service||0),
    total:Number(t.total||0),
    status:'new',
    whatsapp_text:text
  };
  // Usa RPC SECURITY DEFINER para permitir que clientes anônimos registrem
  // pedidos sem depender de leitura direta da tabela client_sites sob RLS.
  const {data,error}=await supabaseClient.rpc('register_pedevia_order_v1261',{
    p_store_key:payload.store_key,
    p_store_name:payload.store_name,
    p_customer_name:payload.customer_name,
    p_customer_phone:payload.customer_phone,
    p_order_mode:payload.order_mode,
    p_address:payload.address,
    p_neighborhood:payload.neighborhood,
    p_table_number:payload.table_number,
    p_payment_method:payload.payment_method,
    p_note:payload.note,
    p_items:payload.items,
    p_subtotal:payload.subtotal,
    p_discount:payload.discount,
    p_delivery_fee:payload.delivery_fee,
    p_payment_adjustment:payload.payment_adjustment,
    p_service_fee:payload.service_fee,
    p_total:payload.total,
    p_whatsapp_text:payload.whatsapp_text
  });
  if(error)throw error;
  const row=Array.isArray(data)?data[0]:data;
  if(!row)throw new Error('O pedido não retornou confirmação do servidor.');
  return row;
}

async function fetchOrdersV125(){
  const key=currentStoreKeyV125();
  const {data,error}=await supabaseClient.from('pedevia_orders').select('*').eq('store_key',key).order('created_at',{ascending:false}).limit(200);
  if(error)throw error;
  return Array.isArray(data)?data:[];
}

function orderCopyTextV125(o){
  if(o.whatsapp_text)return o.whatsapp_text;
  const lines=[`*PEDIDO ${orderNumberV125(o)} · ${o.store_name||currentStoreNameV125()}*`,''];
  (o.items||[]).forEach(i=>lines.push(`*${i.quantity||1}x ${i.name||'Produto'}* — ${brl((+i.unit_price||0)*(+i.quantity||1))}`));
  lines.push('',`Cliente: ${o.customer_name||'-'}`,`Celular: ${o.customer_phone||'-'}`,`Tipo: ${orderModeLabelV125(o.order_mode)}`,`Pagamento: ${paymentKeyLabel(o.payment_method)}`,`*TOTAL: ${brl(+o.total||0)}*`);
  return lines.join('\n');
}
async function copyOrderV125(id){
  const o=(window.pedeviaOrdersV125||[]).find(x=>String(x.id)===String(id));if(!o)return;
  try{await navigator.clipboard.writeText(orderCopyTextV125(o));alert('Pedido copiado. Agora é só colar no WhatsApp do cliente.')}catch(_e){prompt('Copie o pedido:',orderCopyTextV125(o))}
}
function viewOrderV125(id){
  const o=(window.pedeviaOrdersV125||[]).find(x=>String(x.id)===String(id));if(!o)return;
  const items=(o.items||[]).map(i=>`<div class="summary"><div class="row"><b>${i.quantity||1}x ${esc(i.name||'Produto')}${i.variant?' · '+esc(i.variant):''}</b><b>${brl((+i.unit_price||0)*(+i.quantity||1))}</b></div>${(i.groups||[]).map(g=>`<small><b>${esc(g.name||'Complementos')}:</b> ${(g.items||[]).map(x=>esc(x.name||x)).join(', ')}</small>`).join('')}${i.note?`<small>Obs.: ${esc(i.note)}</small>`:''}</div>`).join('');
  showModal(`<div class="row"><div><h2 style="margin:0">Pedido ${orderNumberV125(o)}</h2><div class="hint">${orderDateV125(o.created_at)}</div></div><button class="ghost" onclick="closeModal()">✕</button></div>${items}<div class="summary"><div><b>${esc(o.customer_name||'-')}</b> · ${esc(o.customer_phone||'-')}</div><small>${orderModeLabelV125(o.order_mode)}${o.neighborhood?' · '+esc(o.neighborhood):''}${o.address?' · '+esc(o.address):''}${o.table_number?' · Mesa '+esc(o.table_number):''}</small><small>Pagamento: ${esc(paymentKeyLabel(o.payment_method))}</small>${o.note?`<small>Obs.: ${esc(o.note)}</small>`:''}<div class="row" style="margin-top:8px"><strong>Total</strong><strong>${brl(+o.total||0)}</strong></div></div><label>Status</label><select id="orderStatusV125" class="field"><option value="new">Novo</option><option value="accepted">Aceito</option><option value="preparing">Preparando</option><option value="ready">Pronto</option><option value="completed">Concluído</option><option value="cancelled">Cancelado</option></select><button class="btn full" onclick="updateOrderStatusV125('${o.id}')">Salvar status</button><button class="ghost full" style="margin-top:8px" onclick="copyOrderV125('${o.id}')">Copiar pedido</button>`);
  setTimeout(()=>{const s=document.getElementById('orderStatusV125');if(s)s.value=o.status||'new'},0);
}
async function updateOrderStatusV125(id){
  const status=document.getElementById('orderStatusV125')?.value||'new';
  const {error}=await supabaseClient.from('pedevia_orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);
  if(error){alert('Não foi possível atualizar o pedido: '+error.message);return}
  closeModal();await loadOrdersPanelV125();
}

async function loadOrdersPanelV125(){
  if(adminTab!=='orders'||adminOrdersView==='config')return;
  const host=document.getElementById('ordersListV125');if(!host)return;
  host.innerHTML='<div class="panel"><p class="hint">Atualizando pedidos...</p></div>';
  try{
    const rows=await fetchOrdersV125();window.pedeviaOrdersV125=rows;
    const newCount=rows.filter(o=>o.status==='new').length;
    const body=rows.length?rows.map(o=>`<div class="panel" style="padding:13px"><div class="row"><div><b style="font-size:17px">${orderNumberV125(o)}</b> <span class="badge ${orderStatusClassV125(o.status)}">${orderStatusLabelV125(o.status)}</span><div class="hint">${orderDateV125(o.created_at)} · ${esc(o.customer_name||'Cliente')} · ${orderModeLabelV125(o.order_mode)}</div></div><b>${brl(+o.total||0)}</b></div><div class="miniBtns" style="margin-top:10px"><button class="ghost" onclick="viewOrderV125('${o.id}')">Ver pedido</button><button class="ghost" onclick="copyOrderV125('${o.id}')">Copiar</button></div></div>`).join(''):'<div class="panel"><h3>Nenhum pedido ainda</h3><p class="hint">Assim que um cliente finalizar um pedido, ele aparecerá aqui automaticamente.</p></div>';
    host.innerHTML=`${newCount?`<div class="notice"><b>${newCount} pedido(s) novo(s)</b> aguardando atendimento.</div>`:''}${body}`;
  }catch(e){
    console.error('Falha ao carregar painel de pedidos:',e);
    host.innerHTML='<div class="notice bad"><b>Painel de pedidos ainda não conectado.</b><br>Execute a configuração SQL da versão 1.25.0 no Supabase e atualize esta página.</div>';
  }
}

// Registra no painel antes de abrir o WhatsApp. Se o banco ainda não estiver configurado,
// o pedido continua podendo seguir para o WhatsApp para não interromper a operação.
const _finishWhatsAppV125Base=finishWhatsApp;
finishWhatsApp=async function(){
  if(!storeAcceptingOrdersV125()){
    alert(closedOrderMessageV125()+' O pedido não foi enviado.');return;
  }
  const btn=document.querySelector('#sheet .checkoutSticky .btn.green, .sheet .checkoutSticky .btn.green');
  if(btn){btn.disabled=true;btn.textContent='Registrando pedido...'}
  try{
    window.checkoutState=window.checkoutState||{};
    const n=document.getElementById('coName'),p=document.getElementById('coPhone'),o=document.getElementById('coObs');
    if(n)window.checkoutState.customer=n.value.trim();if(p)window.checkoutState.phone=p.value.trim();if(o)window.checkoutState.note=o.value.trim();
    if(!window.checkoutState.customer||!window.checkoutState.phone){alert('Informe seu nome e celular.');return}
    let created=null;
    try{created=await createOnlineOrderV125()}catch(e){
      console.error('Pedido não foi salvo no painel:',e);
      alert('Não foi possível registrar o pedido no painel. Atualize a página e tente novamente. Se continuar, avise o estabelecimento.');
      return;
    }
    if(created){
      const num=orderNumberV125(created);
      window.pedeviaCurrentOrderNumberV125=num;
      const oldBuild=buildOrderTextV111;
      buildOrderTextV111=function(){
        const txt=oldBuild();
        return `🧾 *PEDIDO ${num}*\n`+txt.replace(/POINT DO AÇAÍ FRONTIN/gi,currentStoreNameV125());
      };
      try{return await _finishWhatsAppV125Base()}finally{buildOrderTextV111=oldBuild}
    }
    return await _finishWhatsAppV125Base();
  }finally{
    if(btn){btn.disabled=false;btn.textContent='☏ Enviar pelo WhatsApp'}
  }
};

async function fetchStoreOrdersV126(limit=1000){
  const key=currentStoreKeyV125();
  const {data,error}=await supabaseClient.from('pedevia_orders').select('*').eq('store_key',key).order('created_at',{ascending:false}).limit(limit);
  if(error)throw error;return Array.isArray(data)?data:[];
}

async function fetchAllStoreOrdersV126(){
  const key=currentStoreKeyV125(),all=[],page=1000,maxPages=20;
  for(let p=0;p<maxPages;p++){
    const from=p*page,to=from+page-1;
    const {data,error}=await supabaseClient.from('pedevia_orders').select('*').eq('store_key',key).order('created_at',{ascending:false}).range(from,to);
    if(error)throw error;
    const rows=Array.isArray(data)?data:[];all.push(...rows);if(rows.length<page)break;
  }

function aggregateCustomersV126(rows){

  rows.forEach(o=>{const phone=normalizePhoneV126(o.customer_phone),key=phone||('nome:'+String(o.customer_name||'').toLowerCase());if(!key)return;let c=m.get(key);if(!c)c={key,phone,name:o.customer_name||'Cliente',orders:0,completed:0,spent:0,last:o.created_at,all:[]};c.orders++;c.all.push(o);if(statusRevenueV126(o)){c.completed++;c.spent+=+o.total||0}if(new Date(o.created_at)>new Date(c.last))c.last=o.created_at;m.set(key,c)});
  return [...m.values()];

function aggregateProductsV126(rows){
  const m=new Map();rows.filter(statusRevenueV126).forEach(o=>(o.items||[]).forEach(i=>{const key=String(i.product_id||i.name||'Produto');let p=m.get(key);if(!p)p={name:i.name||'Produto',qty:0,revenue:0};const q=+i.quantity||1;p.qty+=q;p.revenue+=(+i.unit_price||0)*q;m.set(key,p)}));return [...m.values()].sort((a,b)=>b.qty-a.qty);

async function loadStatisticsV126(){

  }catch(e){console.error(e);host.innerHTML='<div class="notice bad"><b>Não foi possível carregar as estatísticas.</b><br>Confirme se o SQL da versão 1.26.0 foi executado.</div>'}

<script>
// ===== v1.31.2: CORREÇÃO DO PEDIDO MÍNIMO =====
// O pedido mínimo de entrega considera SOMENTE o valor dos produtos.
// Taxa de entrega, taxa de serviço e outros acréscimos não ajudam a atingir o mínimo.
function minimumOrderCheckV1312(){
  const minimum=Math.max(0,Number(cfg?.store?.minimumOrder||0));
  const products=Math.max(0,Number(typeof cartSubtotal==='function'?cartSubtotal():sum()));
  return {
    minimum,
    products,
    missing:Math.max(0,minimum-products),
    ok:minimum<=0 || products+0.0001>=minimum
  };
}

function minimumOrderMessageV1312(){
  const c=minimumOrderCheckV1312();
  return `O pedido mínimo para entrega é ${brl(c.minimum)} em produtos.\n\n`+
         `Produtos no carrinho: ${brl(c.products)}\n`+
         `Faltam: ${brl(c.missing)}\n\n`+
         `A taxa de entrega não conta para atingir o pedido mínimo.`;
}

const _selectReceiveV1312Base=selectReceive;
selectReceive=function(m){
  if(m==='delivery'){
    const c=minimumOrderCheckV1312();
    if(!c.ok){
      alert(minimumOrderMessageV1312());
      showCart();
      return;
    }
  }
  return _selectReceiveV1312Base(m);
};

// Segunda validação no envio: protege o pedido caso o mínimo seja alterado
// enquanto o cliente já está no checkout ou alguma etapa seja contornada.
const _finishWhatsAppV1312Base=finishWhatsApp;
finishWhatsApp=async function(){
  if((window.checkoutState||{}).mode==='delivery'){
    const c=minimumOrderCheckV1312();
    if(!c.ok){
      alert(minimumOrderMessageV1312());
      return;
    }
  }
  return await _finishWhatsAppV1312Base();
};

setTimeout(()=>{
  document.querySelectorAll('.adminHead .hint').forEach(el=>{

      el.textContent=(el.textContent||'').replace(/Versão\s+1\.[0-9.]+/i,'Versão 1.32.41');
  });
},1100);

(function(){
  function cleanDeliveryAddressV1313(address,reference){
    let a=String(address||'').trim();

      const suffix=' · '+r;
      if(a.endsWith(suffix))a=a.slice(0,-suffix.length).trim();
    }
    return a;
  }

  function optionLineV1313(x){
    const q=Math.max(1,Number(x?.qty||1));
    const price=Math.max(0,Number(x?.price||0));
    return `   ↳ ${q}x ${String(x?.name||'Complemento')}${price?` (+${brl(price*q)})`:''}`;
  }

  buildOrderTextV111=function(){
    normalizeOrderExtrasV111();

    const storeName=String(cfg.store.name||'Estabelecimento').trim();

    cart.forEach(i=>{
      const p=cfg.products.find(x=>x.id===i.pid)||{};

      if(i.variantId && Array.isArray(p.variants)){
        const v=p.variants.find(x=>x.id===i.variantId);

      const qty=Math.max(1,Number(i.qty||1));

      L.push(`*${qty}x ${productName} (${brl(base*qty)})*`);

<script>
// ===== v1.31.6: CORREÇÃO DEFINITIVA DA QUANTIDADE NO CARRINHO =====
(function(){

  // Atualiza o item diretamente no carrinho real e reconstrói o modal.
  changeCartQty=function(index,delta){
    index=Number(index);
    delta=Number(delta);
    if(!Number.isInteger(index) || !cart[index]) return;

    const current=Math.max(1,Number(cart[index].qty)||1);
    const next=Math.max(1,current+delta);

    if(next===current && delta<0) return;

    cart[index].qty=next;

    // Persiste/recalcula carrinho.
    try{ updateCart(); }catch(e){
      try{ saveCart?.(); }catch(_){}
      try{ renderCart?.(); }catch(_){}
    }

    // Em vez de depender do HTML antigo do modal, fecha e reconstrói
    // o carrinho usando o estado atualizado.
    try{
      const sheet=document.getElementById('sheet');
      if(sheet) sheet.innerHTML='';
      showCart();
    }catch(e){
      console.error('Falha ao redesenhar carrinho:',e);
    }

    // Feedback visual após a reconstrução.
    requestAnimationFrame(()=>{
      const rows=document.querySelectorAll('#sheet .cartItem');
      const row=rows[index];
      if(!row)return;

      // Procura o número central mesmo se a classe do HTML legado variar.
      let num=row.querySelector('.cartQty .num');
      if(!num){
        const controls=[...row.querySelectorAll('button')];
        const minus=controls.find(b=>(b.textContent||'').trim()==='-');
        const plus=controls.find(b=>(b.textContent||'').trim()==='+');
        if(minus && plus){
          let n=minus.nextElementSibling;
          if(n && n!==plus) num=n;
        }
      }

      if(num){
        num.textContent=String(next);
        num.style.transform='scale(1.22)';
        num.style.transition='transform .16s ease';
        setTimeout(()=>{num.style.transform='scale(1)'},170);
      }
    });
  };

  // Garante que todos os botões +/- do modal chamem a função acima,
  // inclusive se o HTML legado tiver sido renderizado por outra camada.
  document.addEventListener('click',function(ev){
    const btn=ev.target.closest('#sheet .cartQty button');
    if(!btn)return;

    const label=(btn.textContent||'').trim();
    if(label!=='+' && label!=='-')return;

    const row=btn.closest('.cartItem');
    if(!row)return;

    const rows=[...document.querySelectorAll('#sheet .cartItem')];
    const index=rows.indexOf(row);
    if(index<0 || !cart[index])return;

    ev.preventDefault();
    ev.stopImmediatePropagation();

    changeCartQty(index,label==='+'?1:-1);
  },true);

  setTimeout(()=>{
    document.querySelectorAll('.adminHead .hint').forEach(el=>{
      if(/Versão\s+1\.[0-9.]+/i.test(el.textContent||'')){
        el.textContent=(el.textContent||'').replace(/Versão\s+1\.[0-9.]+/i,'Versão 1.32.41');
      }
    });
  },1200);

})();
</script>

(function(){

  function authErrorTextV13112(error){
    const raw=String(error?.message||error||'').toLowerCase();

    if(raw.includes('invalid login credentials') || raw.includes('invalid credentials'))
      return 'E-mail ou senha não conferem. Você pode usar “Redefinir senha” abaixo.';
    if(raw.includes('email not confirmed'))
      return 'Este e-mail ainda não foi confirmado. Confira a caixa de entrada.';
    if(raw.includes('too many requests') || raw.includes('rate limit'))
      return 'Muitas tentativas em pouco tempo. Aguarde alguns minutos e tente novamente.';
    if(raw.includes('network') || raw.includes('fetch'))
      return 'Não foi possível conectar ao servidor. Confira sua internet e tente novamente.';
    if(raw.includes('acesso administrativo'))
      return String(error.message||error);

    return 'Não foi possível entrar. Tente novamente ou redefina sua senha.';
  }

  window.toggleLoginPasswordV13112=function(){
    const input=document.getElementById('loginPass');
    const btn=document.getElementById('toggleLoginPassV13112');

    const email=String(document.getElementById('loginEmail')?.value||'').trim().toLowerCase();
    const msg=document.getElementById('loginMsg');
    const btn=document.getElementById('resetAdminPassV13112');

    if(!email){
      if(msg)msg.textContent='Digite o e-mail do administrador primeiro.';
      document.getElementById('loginEmail')?.focus();
      return;

    if(btn){

      btn.textContent='Enviando...';

        : `${PEDEVIA_PUBLIC_BASE}/?definir-senha=1`;

      const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{
        redirectTo:redirect
      });

      if(msg){
        msg.textContent='Link enviado. Abra o e-mail da Pedevia para criar uma nova senha. Confira também o spam.';
        msg.style.color='var(--ok,#198b57)';

    const password=document.getElementById('loginPass')?.value||'';

      btn.disabled=true;

      msg.style.color='';

    try{
      const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
      if(error)throw error;
      if(!data?.session)throw new Error('Sessão não iniciada.');

      logged=true;

      if(slug){

        renderAdmin();

      if(msg)msg.textContent='';

    }catch(e){
      console.error('Falha no login Supabase:',e);

      // Se o Supabase autenticou mas a pessoa não tem acesso àquela loja,

      try{
        const {data:s}=await supabaseClient.auth.getSession();

      if(msg){
        msg.textContent=authErrorTextV13112(e);

  // Também coloca mostrar/ocultar senha nas telas de criação/redefinição.
  function enhancePasswordModalV13112(){
    [
      ['newPassV122','toggleNewPass1V13112'],
      ['newPass2V122','toggleNewPass2V13112']
    ].forEach(([inputId,btnId])=>{
      const input=document.getElementById(inputId);
      if(!input || document.getElementById(btnId))return;

      const b=document.createElement('button');

      b.type='button';
      b.className='ghost full';
      b.style.margin='6px 0 8px';
      b.textContent='👁 Mostrar senha';
      b.onclick=()=>{
        const showing=input.type==='text';
        input.type=showing?'password':'text';
        b.textContent=showing?'👁 Mostrar senha':'🙈 Ocultar senha';
      };
      input.insertAdjacentElement('afterend',b);
    });
  }

  document.addEventListener('DOMContentLoaded',()=>{
    ensureUnifiedLoginControlsV13112();
    setTimeout(ensureUnifiedLoginControlsV13112,500);
  });

  // Modal de redefinição é criado dinamicamente.
  const authUiObserverV13112=new MutationObserver(()=>{
    ensureUnifiedLoginControlsV13112();
    enhancePasswordModalV13112();
  });
  document.addEventListener('DOMContentLoaded',()=>{
    authUiObserverV13112.observe(document.body,{childList:true,subtree:true});
  });

  setTimeout(()=>{
    document.querySelectorAll('.adminHead .hint').forEach(el=>{
      if(/Versão\s+1\.[0-9.]+/i.test(el.textContent||'')){
        el.textContent=(el.textContent||'').replace(/Versão\s+1\.[0-9.]+/i,'Versão 1.32.41');
      }
    });
  },1200);

})();

<script>
// ===== v1.31.14: CARREGAMENTO RÁPIDO DOS ESTABELECIMENTOS =====
(function(){

  const TENANT_CACHE_PREFIX_V13114='pedevia:public-store-cache:';

  function tenantCacheKeyV13114(slug){
    return TENANT_CACHE_PREFIX_V13114+String(slug||'').toLowerCase();
  }

  function readTenantCacheV13114(slug){
    try{
      const raw=localStorage.getItem(tenantCacheKeyV13114(slug));
      if(!raw)return null;
      const box=JSON.parse(raw);
      if(!box?.row?.slug)return null;
      return box.row;
    }catch(e){return null}
  }

  function writeTenantCacheV13114(row){
    try{
      if(!row?.slug)return;
      localStorage.setItem(
        tenantCacheKeyV13114(row.slug),
        JSON.stringify({savedAt:Date.now(),row})
      );
    }catch(e){}
  }

  // Toda configuração pública carregada com sucesso passa a alimentar o cache.
  const applyTenantBaseV13114=applyTenantConfigV121;
  applyTenantConfigV121=function(row){
    const r=applyTenantBaseV13114(row);
    writeTenantCacheV13114(row);
    return r;
  };

  // Guarda a inicialização final já existente (inclui suspensão, tenant, etc.).
  const initializeBaseV13114=initializeOnlineStateV13;

  initializeOnlineStateV13=async function(){
    const slug=tenantSlugFromLocationV121();

    // Point/Admin principal mantém exatamente o fluxo normal.
    if(!slug){
      releaseTenantBootV1317?.();
      return initializeBaseV13114();
    }

    // 1) Se este aparelho já abriu a loja alguma vez, desenha IMEDIATAMENTE
    // usando o cache local, sem esperar Supabase.
    const cached=readTenantCacheV13114(slug);
    if(cached){
      try{
        applyTenantConfigV121(cached);
        renderShop();
        updateCart();
        releaseTenantBootV1317?.();
      }catch(e){
        console.warn('Cache público da loja inválido; carregando online.',e);
      }

      // 2) Atualiza silenciosamente em segundo plano.
      try{
        const fresh=await loadTenantRowV121(slug);
        if(fresh){
          applyTenantConfigV121(fresh);
          renderShop();
          updateCart();
          return true;
        }

        const info=await publicServiceInfoV131(slug);
        if(info?.slug){
          showServiceUnavailableV131(info);
          return false;
        }
      }catch(e){
        console.warn('Atualização online da loja falhou; mantendo cache.',e);
      }
      return true;
    }

    // Primeiro acesso neste aparelho: apenas uma consulta online.
    // A v1.31.7 libera a página assim que o estabelecimento for aplicado,
    // sem aguardar o antigo timeout de 10 segundos.
    return initializeBaseV13114();
  };

  // Versão visual.
  setTimeout(()=>{
    document.querySelectorAll('.adminHead .hint').forEach(el=>{
      if(/Versão\s+1\.[0-9.]+/i.test(el.textContent||'')){
        el.textContent=(el.textContent||'').replace(/Versão\s+1\.[0-9.]+/i,'Versão 1.32.41');
      }
    });
  },1200);

})();

// IMPORTANTE: esta agora é a ÚNICA inicialização real do site.
// Ela acontece depois que todas as correções/overrides foram carregadas.
initializeOnlineStateV13();
</script>

  // contaminar os próximos salvamentos. Agora cada tentativa se recupera
  // da anterior e inicia uma nova operação limpa.
  persistAdminStateV15=async function({products=true,notify=false,message='Alterações salvas online.'}={}){
    try{localStorage.setItem(KEY,JSON.stringify(cfg))}catch(e){console.warn('Falha no cache local',e)}

    const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();
    if(sessionError)throw sessionError;

    if(!sessionData?.session){
      setSyncStatusV15('error','Sessão administrativa ausente.');
      if(notify) alert('Sua sessão expirou. Entre novamente no Admin para salvar online.');
      return false;
    }

    setSyncStatusV15('saving');

    try{
      // Recupera qualquer rejeição anterior antes de encadear o novo save.
      v15SyncPromise=Promise.resolve(v15SyncPromise)
        .catch(err=>{
          console.warn('Salvamento anterior falhou; fila liberada para nova tentativa.',err);
        })
        .then(async()=>{
          await saveSiteConfigOnline();
          if(products)await syncAllProductsOnline();
        });

      await v15SyncPromise;
      setSyncStatusV15('ok');
      if(notify)alert(message);
      return true;

      // Muito importante: não deixa a fila "envenenada" para o próximo clique.
      v15SyncPromise=Promise.resolve();

  window._newProductLockV132=false;

  const closeModalBaseV132=closeModal;

      cfg.products=cfg.products.filter(x=>String(x.id)!==String(id));

    window._editingProductV132=null;
    window._newProductLockV132=false;
    return closeModalBaseV132.apply(this,arguments);
  };

  newProduct=function(sectionId){
    if(window._newProductLockV132)return;
    window._newProductLockV132=true;

    const existing=(cfg.products||[]).find(p=>p._draftNewV132);
    if(existing){
      window._editingProductV132=existing.id;
      editProduct(existing.id);
      setTimeout(()=>window._newProductLockV132=false,500);
      return;
    }

    const sid=sectionId||cfg.sections?.[0]?.id||'produtos';
    const standard=(cfg.groups||[]).filter(g=>['caldas','complementos','adicionais','talher'].includes(g.id)).map(g=>g.id);
    const p={
      id:'p'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
      category:sid,name:'Novo produto',desc:'',detailedDesc:'',price:0,
      status:'available',image:'',images:[],groups:standard,
      _draftNewV132:true
    };
    cfg.products.push(p);
    window._editingProductV132=p.id;
    editProduct(p.id);
    setTimeout(()=>window._newProductLockV132=false,500);
  };

  const editProductBaseV132=editProduct;
  editProduct=function(id){
    window._editingProductV132=id;
    editProductBaseV132(id);
    setTimeout(()=>{
      const modal=document.getElementById('sheet');
      if(!modal)return;
      const saveBtn=modal.querySelector('.stickySave .btn');
      if(saveBtn){
        saveBtn.id='saveProductBtnV132';
        saveBtn.textContent='Salvar produto';
      }
      const cancel=modal.querySelector('.stickySave .ghost');
      if(cancel)cancel.textContent='Cancelar';
    },0);
  };

  previewProductImage=function(id,input){
    const file=input?.files?.[0];
    if(!file)return;
    if(!file.type.startsWith('image/')){alert('Selecione uma imagem válida.');return}
    if(file.size>8*1024*1024){alert('A imagem deve ter no máximo 8 MB.');return}

    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height));
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        const data=canvas.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.88);
        const p=(cfg.products||[]).find(x=>String(x.id)===String(id));
        if(!p)return;
        p._pendingImage=data;
        const prev=document.getElementById('prodPrev');
        if(prev)prev.innerHTML=`<img src="${data}">`;
        const url=document.getElementById('epi');
        if(url)url.value='';
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  };

  saveProduct=async function(id){
    if(window._savingProductV132)return;
    const p=(cfg.products||[]).find(x=>String(x.id)===String(id));
    if(!p)return;

    const btn=document.getElementById('saveProductBtnV132')||document.querySelector('.stickySave .btn');
    const oldText=btn?.textContent||'Salvar produto';
    window._savingProductV132=true;

    try{
      if(btn){btn.disabled=true;btn.textContent='Salvando produto...'}

      try{PedeviaV130.captureProductFlags(id)}catch(e){}

      p.name=document.getElementById('epn')?.value.trim()||'Produto';
      p.desc=document.getElementById('epd')?.value||'';
      p.detailedDesc=document.getElementById('epdetail')?.value||'';
      p.price=+document.getElementById('epp')?.value||0;
      p.category=document.getElementById('epc')?.value||p.category;
      p.status=document.getElementById('eps')?.value||'available';

      if(typeof collectVariantsFromEditor==='function'){
        p.variants=collectVariantsFromEditor();
        delete p._draftVariants;
      }

      if(typeof hasVariants==='function'&&!hasVariants(p)){
        p.allowedModes={
          delivery:document.getElementById('pmDelivery')?.checked??true,
          pickup:document.getElementById('pmPickup')?.checked??false,
          dinein:document.getElementById('pmDinein')?.checked??false
        };
        if(!p.allowedModes.delivery&&!p.allowedModes.pickup&&!p.allowedModes.dinein)
          throw new Error('Escolha pelo menos uma forma de atendimento para este produto.');
      }else if(typeof hasVariants==='function'&&hasVariants(p)){
        if(!p.variants?.length)throw new Error('Adicione pelo menos um tamanho.');
        if(p.variants.some(v=>!v.allowedModes?.delivery&&!v.allowedModes?.pickup&&!v.allowedModes?.dinein))
          throw new Error('Cada tamanho precisa ter pelo menos uma forma de atendimento.');
      }

      const typedUrl=document.getElementById('epi')?.value.trim()||'';
      if(p._pendingImage){
        if(btn)btn.textContent='Enviando imagem...';
        p.image=await PedeviaV130.uploadProductImage(id,p._pendingImage);
        delete p._pendingImage;
      }else if(typedUrl){
        p.image=typedUrl;
      }

      if(btn)btn.textContent='Gravando produto...';
      const ok=await persistAdminStateV15({products:true,notify:false});
      if(!ok)throw new Error('O servidor não confirmou o salvamento do produto.');

      delete p._draftNewV132;
      window._editingProductV132=null;
      try{localStorage.setItem(KEY,JSON.stringify(cfg))}catch(e){}
      renderShop();

      window._savingProductV132=false;
      closeModalBaseV132();
      renderAdmin();

      if(typeof pedeviaToastV1315==='function')pedeviaToastV1315('✓ Produto salvo e publicado no cardápio');
      else alert('Produto salvo.');

    }catch(e){
      console.error('Falha ao salvar produto v1.32.0:',e);
      if(typeof pedeviaToastV1315==='function')pedeviaToastV1315(e.message||'Não foi possível salvar o produto.','error');
      else alert(e.message||'Não foi possível salvar o produto.');
    }finally{
      window._savingProductV132=false;
      const b=document.getElementById('saveProductBtnV132')||btn;
      if(b){b.disabled=false;b.textContent=oldText}
    }
  };

  saveGeneralHours=async function(){
    const btn=[...document.querySelectorAll('#adminContent button')].find(b=>/salvar horários/i.test(b.textContent||''));
    const old=btn?.textContent||'Salvar horários';
    try{
      if(btn){btn.disabled=true;btn.textContent='Salvando horários...'}

      cfg.store.scheduleMode=document.getElementById('gSchedule')?.value||'fixed';
      cfg.store.hours=cfg.store.hours||{};
      for(let i=0;i<7;i++){
        const list=[];
        for(let k=1;k<=2;k++){
          const a=document.getElementById(`ga${i}_${k}`)?.value||'';
          const b=document.getElementById(`gb${i}_${k}`)?.value||'';
          if(a&&b)list.push([a,b]);
        }
        cfg.store.hours[String(i)]=list;
      }

      const ok=await persistAdminStateV15({products:false,notify:false});
      if(!ok)throw new Error('O servidor não confirmou os horários.');

      renderShop();
      generalHours();
      if(typeof pedeviaToastV1315==='function')pedeviaToastV1315('✓ Horários salvos com sucesso');
    }catch(e){
      console.error(e);
      if(typeof pedeviaToastV1315==='function')pedeviaToastV1315('Não foi possível salvar os horários.','error');
      else alert('Não foi possível salvar os horários: '+(e.message||e));
    }finally{
      const b=[...document.querySelectorAll('#adminContent button')].find(x=>/salvar horários|salvando horários/i.test(x.textContent||''))||btn;
      if(b){b.disabled=false;b.textContent=old}
    }
  };

  function actionBusyTextV132(label){
    const t=String(label||'').trim().toLowerCase();
    if(/^salvar|^concluir/.test(t))return'Salvando...';
    if(/^adicionar|^criar|^\+/.test(t))return'Adicionando...';
    if(/^editar/.test(t))return'Abrindo edição...';
    if(/^excluir|^remover/.test(t))return'Excluindo...';
    if(/^ativar|^desativar|^pausar|^retomar|^reabrir/.test(t))return'Atualizando...';
    if(/^enviar|^convidar|^reenviar/.test(t))return'Enviando...';
    if(/^duplicar/.test(t))return'Duplicando...';
    return null;
  }

  document.addEventListener('click',ev=>{
    const btn=ev.target?.closest?.('button');
    if(!btn || !btn.closest('#adminView') || btn.disabled || btn.dataset.noAutoBusy==='1')return;
    const busy=actionBusyTextV132(btn.textContent);
    if(!busy)return;

    setTimeout(()=>{
      if(!btn.isConnected || btn.disabled)return;
      if(btn.dataset.pedeviaBusy==='1')return;
      const original=btn.textContent;
      btn.dataset.pedeviaBusy='1';
      btn.dataset.pedeviaOriginalText=original;
      btn.textContent=busy;
      btn.classList.add('v132Busy');
      btn.setAttribute('aria-busy','true');
      btn.disabled=true;

      setTimeout(()=>{
        if(!btn.isConnected)return;
        if(btn.dataset.pedeviaBusy!=='1')return;
        btn.disabled=false;
        btn.textContent=btn.dataset.pedeviaOriginalText||original;
        btn.classList.remove('v132Busy');
        btn.removeAttribute('aria-busy');
        delete btn.dataset.pedeviaBusy;
      },8000);
    },0);
  },false);

  setTimeout(()=>{
    if(typeof applyPedeviaVersion==='function')applyPedeviaVersion();
  },1000);

})();
</script>

<script>
// ===== v1.32.1: CONSOLIDAÇÃO DO GRANDE CONSERTO + AUDITORIA DE OVERRIDES =====
(function(){
  window.PEDEVIA_VERSION='1.32.41';

  // 1) Placeholder da marca: uma frase única, legível e realmente centralizada.
  const st=document.createElement('style');
  st.id='pedeviaV1321Styles';
  st.textContent=`
    .brandPreview,.brandPreviewV13119,.brandBlockV13119{
      text-align:center!important;
    }
    .brandPreview,.brandPreviewV13119{
      display:flex!important;
      align-items:center!important;

  document.head.appendChild(st);

  function normalizeLogoPlaceholderV1321(root=document){
    root.querySelectorAll?.('.brandFallback,.brandFallbackV13119,.brandFallbackV132').forEach(el=>{
      if(/LOGO\s*DO\s*ESTABELECIMENTO/i.test(el.textContent||'')){
        el.innerHTML='';
        el.textContent='LOGO DO ESTABELECIMENTO';
        el.classList.add('brandFallbackV1321');
      }
    });
  }
  normalizeLogoPlaceholderV1321();
  new MutationObserver(()=>normalizeLogoPlaceholderV1321())
    .observe(document.documentElement,{childList:true,subtree:true});

  // 2) Aparência: a v1.32.0 já montou 9 listas x 20 templates.
  // Esta camada garante que os antigos controles automáticos de composição/acabamento
  // não reapareçam por renderizações históricas. Personalização manual fica só no bloco
  // "Ajustar cores uma por uma", onde também ficam os degradês.
  function cleanLegacyAppearanceV1321(){
    const host=document.getElementById('adminContent');
    if(!host)return;
    const appearanceText=(host.textContent||'').toLowerCase();
    if(!appearanceText.includes('aparência'))return;
    host.querySelectorAll('.v117Section,.cfgBlock,.panel').forEach(box=>{
      const t=(box.textContent||'').toLowerCase();
      if(
        t.includes('composição geral') ||
        t.includes('acabamento geral') ||
        t.includes('degradês e superfícies') ||
        t.includes('superfícies')
      ){
        if(!box.closest('#manualColorsV132')) box.style.display='none';
      }
    });
  }
  new MutationObserver(cleanLegacyAppearanceV1321)
    .observe(document.getElementById('adminContent')||document.body,{childList:true,subtree:true});
  cleanLegacyAppearanceV1321();

  // 3) Feedback universal para ações administrativas.
  // Os saves críticos possuem estado ligado à Promise; este fallback cobre os demais botões.
  const verbs=[
    [/^(salvar|concluir)/i,'Salvando...'],
    [/^(adicionar|criar|\+)/i,'Adicionando...'],
    [/^editar/i,'Abrindo edição...'],
    [/^(excluir|remover)/i,'Excluindo...'],
    [/^(ativar|desativar|pausar|retomar|reabrir|atualizar)/i,'Atualizando...'],
    [/^(enviar|convidar|reenviar)/i,'Enviando...'],
    [/^duplicar/i,'Duplicando...']
  ];
  document.addEventListener('click',ev=>{
    const b=ev.target?.closest?.('button');
    if(!b || !b.closest('#adminView') || b.disabled || b.dataset.pedeviaWorking==='1')return;
    const original=(b.textContent||'').trim();
    const hit=verbs.find(([rx])=>rx.test(original));
    if(!hit)return;
    // Deixa o handler original do botão iniciar primeiro.
    queueMicrotask(()=>{
      if(!b.isConnected || b.disabled || b.dataset.pedeviaWorking==='1')return;
      b.dataset.pedeviaWorking='1';
      b.dataset.pedeviaOriginal=original;
      b.textContent=hit[1];
      b.setAttribute('aria-busy','true');
      // Fallback apenas para ações antigas que não devolvem Promise/estado próprio.
      setTimeout(()=>{
        if(!b.isConnected || b.dataset.pedeviaWorking!=='1')return;
        b.textContent=b.dataset.pedeviaOriginal||original;
        b.removeAttribute('aria-busy');
        delete b.dataset.pedeviaWorking;
      },12000);
    });
  },false);

  // 4) Guarda extra contra múltiplos "Novo produto" vindos de handlers históricos.
  let creatingGuard=false;
  const stableNewProduct=window.newProduct;
  window.newProduct=function(sectionId){
    if(creatingGuard || window._savingProductV132)return;
    creatingGuard=true;
    try{
      const drafts=(cfg.products||[]).filter(p=>p && p._draftNewV132);
      if(drafts.length>1){
        const keep=drafts[0];
        cfg.products=(cfg.products||[]).filter(p=>!p?._draftNewV132 || p===keep);
      }
      const existing=(cfg.products||[]).find(p=>p?._draftNewV132);

(function(){

  async function restoreAdminSessionV1324(){
    if(restoringSessionV1324)return false;

    try{
      if(!window.supabaseClient?.auth)return false;

      // O Supabase persiste/renova a sessão no navegador. Ao recarregar a página,
      // reaproveitamos a sessão existente em vez de exigir novo sign-in.
      const {data,error}=await window.supabaseClient.auth.getSession();
      if(error)throw error;
      const session=data?.session;
      if(!session)return false;

      const slug=typeof window.tenantSlugFromLocationV121==='function'
        ? window.tenantSlugFromLocationV121()
        : '';

      // Tenant: valida novamente que o usuário autenticado continua sendo
      // administrador da loja antes de liberar o painel.
      if(slug && typeof window.enterTenantAdminV122==='function'){
        try{
          await window.enterTenantAdminV122();
          return true;
        }catch(e){
          console.warn('Sessão existente não autorizada para este estabelecimento.',e);
          return false;
        }
      }

      // Point / administração principal: mantém a sessão e deixa o fluxo
      // administrativo existente validar o acesso normalmente.
      window.logged=true;
      if(typeof window.renderAdmin==='function' && document.getElementById('admin')){
        try{ window.renderAdmin(); }catch(e){}
      }
      return true;
    }catch(e){
      console.warn('Não foi possível restaurar a sessão administrativa.',e);
      return false;
    }finally{
      restoringSessionV1324=false;
    }
  }

  window.restoreAdminSessionV1324=restoreAdminSessionV1324;

  // Executa em todo reload, inclusive depois de publicar uma nova versão.
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',()=>setTimeout(restoreAdminSessionV1324,0),{once:true});

      if((event==='INITIAL_SESSION' || event==='SIGNED_IN' || event==='TOKEN_REFRESHED') && session){
        setTimeout(restoreAdminSessionV1324,0);
      }
    });
  }catch(e){}

  window.PEDEVIA_SESSION_REFRESH_FIX_V1324={

    const texts=['taxa por áreas de entrega','taxa por areas de entrega','taxa por distância (km)','taxa por distancia (km)'];
    root.querySelectorAll('label,.card,.settingCard,.adminCard,.choice,.option,.radioCard,.delivery-option,div').forEach(el=>{
      const t=clean(el.innerText).toLowerCase();
      if(!t||t.length>260)return;
      if(texts.some(x=>t.includes(x))){
        let box=el.closest('label,.card,.settingCard,.adminCard,.choice,.option,.radioCard,.delivery-option')||el;
        box.style.display='none';
        box.setAttribute('data-pedevia-obsolete-delivery','1');
      }
    });
  }

  function refreshAddressEverywhereV13214(root=document){
    const addr=storeAddressV13214();
    if(!addr)return;

    // Menus/cartões que exibiam "Endereço não informado".
    root.querySelectorAll('*').forEach(el=>{
      if(el.children.length) return;
      const t=clean(el.textContent).toLowerCase();
      if(t==='endereço não informado'||t==='endereco não informado'||t==='não informado'){
        // Evita trocar "Não informado" de campos sem relação com endereço.
        const parent=el.parentElement;
        const context=clean(parent?.innerText).toLowerCase();
        if(t!=='não informado'||context.includes('endereço')||context.includes('endereco')){
          el.textContent=addr;
        }
      }
    });

    // Linha "Endereço" no menu Mais: coloca resumo abaixo, igual Contato/Redes.
    root.querySelectorAll('*').forEach(el=>{
      if(el.children.length) return;
      const t=clean(el.textContent).toLowerCase();
      if(t!=='endereço'&&t!=='endereco') return;
      const row=el.closest('button,.card,.settingCard,.adminCard,.menuItem,.moreItem,.row,div');
      if(!row) return;
      const all=clean(row.innerText).toLowerCase();
      if(all.length>120||all.includes('endereço de entrega'))return;
      let sub=[...row.querySelectorAll('small,.muted,.sub,.subtitle,p')].find(x=>x!==el);
      if(sub){ sub.textContent=addr; }
      else if(row.children.length<8){
        const d=document.createElement('div');
        d.className='muted pedevia-address-summary';
        d.style.cssText='font-size:.95em;margin-top:2px;';
        d.textContent=addr;
        (el.parentElement||row).appendChild(d);
      }
    });
  }

  function applyV13214(){
    removeObsoleteDeliveryModesV13214();
    hideObsoleteDeliveryUIV13214();
    refreshAddressEverywhereV13214();
  }

  let scheduled=false;
  const obs=new MutationObserver(()=>{
    if(scheduled)return; scheduled=true;
    requestAnimationFrame(()=>{scheduled=false;applyV13214();});
  });
  function boot(){
    applyV13214();
    if(document.body)obs.observe(document.body,{subtree:true,childList:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true}); else boot();

  // Após salvar qualquer configuração, re-renderizações também recebem o endereço correto.
  document.addEventListener('click',e=>{
    const b=e.target.closest('button');
    if(!b)return;
    const t=clean(b.innerText).toLowerCase();
    if(t.includes('salvar endereço')||t==='concluir'){
      setTimeout(applyV13214,150);
      setTimeout(applyV13214,700);
    }
  },true);
})();

(function(){

  function normalizeCommercialConfigV13222(){

    });

      }

  [0,500,1300,2500].forEach(ms=>setTimeout(enforceVersionV13222,ms));

  window.pedeviaPreflightV13222=function(){
    const issues=[];
    try{

  // se as camadas existentes realmente aplicarem uma configuração diferente.
  if(slug){
    let cached=null;
    try{
      const box=JSON.parse(localStorage.getItem('pedevia:public-store-cache:'+slug)||'null');
      if(box?.row?.slug===slug)cached=box.row;
    }catch(_e){}
    if(cached){
      try{
        applyTenantConfigV121(cached);
        renderShop();
        applyBrandHeaderV116();
      }catch(_e){}
      revealV13241();
    }else{
      root.setAttribute('data-pedevia-first-paint','1');
      // Sem cache, não há como exibir dados reais antes da primeira resposta.
      // Revela assim que a inicialização online liberar o boot.
      const releaseBase=window.releaseTenantBootV1317;
      if(typeof releaseBase==='function'){
        window.releaseTenantBootV1317=function(){
          const r=releaseBase.apply(this,arguments);
          requestAnimationFrame(revealV13241);
          return r;
        };
      }else{
        requestAnimationFrame(revealV13241);
      }
    }
  }else{
    // Point/base: configuração já está embutida; não há motivo para esperar.
    renderShop();
    revealV13241();
  }

  // Não há 600/760/1800ms de espera visual nesta versão.
  if(typeof window.applyPedeviaVersion==='function')window.applyPedeviaVersion();
})();
</script>
